<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リグロス福笑い</title>
<meta name="theme-color" content="#1e3a5f">
<meta name="description" content="めかくしで かおをつくる ふくわらいゲーム">
<meta property="og:type" content="website">
<meta property="og:site_name" content="リグロス福笑い">
<meta property="og:title" content="リグロス福笑い">
<meta property="og:description" content="めかくしで かおをつくる ふくわらいゲーム">
<meta property="og:url" content="https://mkj-game-club.todoroki-hajime.com/">
<meta property="og:image" content="https://mkj-game-club.todoroki-hajime.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mkj-game-club.todoroki-hajime.com/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260816f">
</head>
<body>

<header class="top">
  <h1 class="title"><span class="kana">ふくわらい</span><span id="title-text">笑福面</span></h1>
  <div class="lang-row">
    <button class="lang-btn" data-lang="ja" type="button">日本語</button>
    <button class="lang-btn" data-lang="zh" type="button">中文</button>
    <button class="lang-btn" data-lang="en" type="button">EN</button>
  </div>
</header>

<main id="app">

  <!-- ── 選單 ─────────────────────────── -->
  <section id="screen-menu" class="screen">
    <div class="menu-bar">
      <button id="profile-chip" class="chip" type="button">なまえを登録する</button>
      <button id="btn-menu-board" class="ghost-btn" type="button">ランキング</button>
    </div>
    <div id="menu-sub" class="menu-sub hidden">
      <button id="btn-group-back" class="ghost-btn" type="button">← カテゴリー</button>
      <span id="group-crumb" class="crumb"></span>
    </div>
    <p id="lead" class="lead">かおを えらんでください</p>
    <div id="face-grid" aria-live="polite"></div>
  </section>

  <!-- ── 遊戲 ─────────────────────────── -->
  <section id="screen-game" class="screen hidden">
    <div class="game-head">
      <button id="btn-back" class="ghost-btn" type="button">← もどる</button>
      <div id="face-title" class="face-title"></div>
      <button id="btn-board" class="ghost-btn" type="button">ランキング</button>
    </div>

    <div id="stage">
      <div id="face-box">
        <img id="face-img" alt="" draggable="false">
        <div id="curtain" aria-hidden="true">
          <span class="curtain-text">めかくし中</span>
        </div>
      </div>
      <div id="tray"></div>
      <div id="parts-layer"></div>
    </div>

    <p id="hint" class="hint"></p>

    <div id="panel-play" class="actions">
      <button id="btn-main" class="main-btn" type="button">はじめる</button>
    </div>

    <div id="panel-result" class="actions result hidden">
      <div class="score-line">
        <span id="score-label-el" class="score-label">とくてん</span>
        <span id="score-value" class="score-value">0</span>
        <span id="score-unit-el" class="score-unit">点</span>
      </div>
      <div class="player-line">
        <span id="player-as">なまえが未登録です</span>
        <button id="btn-edit-profile" class="link-btn" type="button">へんこう</button>
      </div>
      <button id="btn-submit" class="main-btn" type="button">ランキングに登録</button>
      <p id="submit-msg" class="submit-msg" aria-live="polite"></p>
      <div class="row share-row">
        <button id="btn-save-img" class="sub-btn" type="button">画像を保存</button>
        <button id="btn-share-native" class="sub-btn hidden" type="button">共有</button>
        <button id="btn-share-x" class="sub-btn brand-x" type="button">X</button>
        <button id="btn-share-fb" class="sub-btn brand-fb" type="button">Facebook</button>
      </div>
      <div class="row">
        <button id="btn-retry" class="sub-btn" type="button">もういちど</button>
        <button id="btn-menu" class="sub-btn" type="button">かおをえらぶ</button>
      </div>
    </div>
  </section>

</main>

<!-- ── なまえ＋推しマーク登録 ─────────── -->
<div id="profile-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="なまえの登録">
  <div class="board-card">
    <div class="board-head">
      <h2 id="profile-title">なまえの登録</h2>
      <button id="btn-profile-close" class="ghost-btn" type="button">とじる</button>
    </div>
    <p id="name-label" class="field-label">なまえ（12文字まで）</p>
    <input id="profile-name" type="text" maxlength="12" autocomplete="nickname" placeholder="なまえ">
    <p id="mark-label" class="field-label">推しマーク</p>
    <div id="mark-grid" class="mark-grid"></div>
    <p id="profile-note" class="profile-note">この端末に保存されます。次からは自動でこのなまえで登録されます。</p>
    <button id="btn-profile-save" class="main-btn" type="button">保存する</button>
  </div>
</div>

<!-- ── 排行榜 ──────────────────────── -->
<div id="board-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="ランキング">
  <div class="board-card">
    <div class="board-head">
      <h2 id="board-title">ランキング</h2>
      <button id="btn-board-close" class="ghost-btn" type="button">とじる</button>
    </div>
    <div id="board-type-tabs" class="tabs"></div>
    <div id="board-scope-tabs" class="tabs scope"></div>
    <ol id="board-list"></ol>
    <p id="board-loading" class="board-empty hidden">よみこみ中…</p>
    <p id="board-empty" class="board-empty hidden">まだ記録がありません。いちばんのりのチャンス！</p>
  </div>
</div>

<script src="app.js?v=20260816f"></script>
</body>
</html>
